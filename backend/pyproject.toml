[project]
name = "backend"
version = "0.1.0"
description = "API FastAPI da plataforma de doações (PIE IV)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
